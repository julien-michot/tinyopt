[workspace]
name = "tinyopt"
version = "0.7.0"
description = "A lightweight, header only optimization library"
authors = ["Julien Michot"]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

[dependencies]
eigen = ">=3.4.0"
cmake = ">=3.25"
ninja = ">=1.10"
compilers = ">=1.0"

# Features

[feature.docs.dependencies]
python = "3.12.*"
matplotlib = ">=3.8"
sphinx = "<8.0"
breathe = ">=4.35.0"
sphinx-rtd-theme = ">=1.0.0"
doxygen = ">=1.18.0"
myst-parser = ">=2.0.0"
catch2 = ">=3.0.1"

[feature.tests.dependencies]
catch2 = ">=3.0.1"

[feature.pip.dependencies]
python = ">=3.9"
pip = "*"

[feature.release.dependencies]
python = ">=3.9"
gh = ">=2.0"

[feature.sophus.dependencies]
sophus = ">=22.10.2"

[feature.ceres.dependencies]
ceres-solver = ">=2.2.0"

[feature.ceres.target.linux-64.dependencies]
openmp = "*"

[feature.ceres.target.osx-64.dependencies]
openmp = "*"

[feature.ceres.target.osx-arm64.dependencies]
llvm-openmp = "*"

[feature.ceres.target.win-64.dependencies]
openmp = "*"

[feature.benchmarks.dependencies]
catch2 = ">=3.0.1"
ceres-solver = ">=2.2.0"
python = "3.12.*"
matplotlib = ">=3.8"

[feature.gtsam.dependencies]
tbb-devel = ">=2021.0"

[feature.gtsam.target.linux-64.dependencies]
gtsam = "==4.3.0"
libboost-headers = "==1.90.0"

[feature.gtsam.target.osx-64.dependencies]
gtsam = "==4.2.0"
libboost-headers = "==1.86.0"

[feature.gtsam.target.osx-arm64.dependencies]
gtsam = "==4.3.0"
libboost-headers = "==1.90.0"

[feature.gtsam.target.win-64.dependencies]
gtsam = "==4.3.0"
libboost-headers = "==1.90.0"

[feature.g2o.target.linux-64.dependencies]
g2o = "==2019.11.23"

[feature.g2o.target.win-64.dependencies]
g2o = "==2019.11.23"

[feature.suitesparse.dependencies]
suitesparse = ">=7.10.1"

[feature.fmt.dependencies]
fmt = ">=8.1.1"
clang-format = ">=18.0.0"
pre-commit = ">=3.7.0"

# --- Environments ---
# This tells Pixi which features to bundle together.
[environments]
default = ["tests"]
all = [ "sophus", "ceres"]
tests = ["tests", "sophus"]
full = ["tests", "sophus", "benchmarks"]
pip = ["pip"]
bench = ["benchmarks"]
test-ceres = ["tests", "sophus", "ceres"]
test-suitesparse = ["tests", "suitesparse"]
bench-suitesparse = ["benchmarks", "suitesparse"]
bench-all = ["benchmarks", "ceres", "gtsam", "g2o"]
docs = ["docs"]
fmt =["fmt"]
release = ["release", "docs"]

[tasks]
# Cross-platform clean command targeting build-$PIXI_ENVIRONMENT_NAME
clean = { cmd = "rm -fr build-$PIXI_ENVIRONMENT_NAME" }
clean-all = { cmd = "rm -fr build*" }
# Generic build
build = { cmd = "cmake -B build-full -G Ninja -DTINYOPT_BUILD_TESTS=ON -DTINYOPT_BUILD_EXAMPLES=ON -DTINYOPT_BUILD_BENCHMARKS=ON -DTINYOPT_BUILD_CERES=ON -DTINYOPT_BUILD_G2O_BENCHMARKS=OFF -DTINYOPT_BUILD_GTSAM_BENCHMARKS=OFF -DTINYOPT_ENABLE_GRADIENT_DESCENT=ON -DTINYOPT_ENABLE_CONJUGATE_GRADIENT=ON -DTINYOPT_ENABLE_DOGLEG=ON -DTINYOPT_ENABLE_BFGS=ON -DTINYOPT_ENABLE_LBFGS=ON && cmake --build build-full", default-environment = "full" }
build-asan = { cmd = "cmake -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=ASAN -DTINYOPT_BUILD_TESTS=ON -DTINYOPT_BUILD_EXAMPLES=ON -DTINYOPT_BUILD_BENCHMARKS=ON -DTINYOPT_BUILD_CERES=ON -DTINYOPT_BUILD_G2O_BENCHMARKS=OFF -DTINYOPT_BUILD_GTSAM_BENCHMARKS=OFF -DTINYOPT_ENABLE_GRADIENT_DESCENT=ON -DTINYOPT_ENABLE_CONJUGATE_GRADIENT=ON -DTINYOPT_ENABLE_DOGLEG=ON -DTINYOPT_ENABLE_BFGS=ON -DTINYOPT_ENABLE_LBFGS=ON && cmake --build build-asan", default-environment = "full" }
tests-asan = { cmd = "ASAN_OPTIONS=allocator_may_return_null=1 ctest --test-dir build-asan --output-on-failure", depends-on = ["build-asan"], default-environment = "full" }

# Formatting
format = { cmd = "./scripts/format.sh", default-environment = "fmt" }
format-check = { cmd = "./scripts/format.sh --check", default-environment = "fmt" }

# Tests - Configures automatically on first run, incrementally builds subsequently
build-tests = { cmd = "cmake -B build-$PIXI_ENVIRONMENT_NAME -G Ninja -DTINYOPT_BUILD_TESTS=ON  && cmake --build build-$PIXI_ENVIRONMENT_NAME", default-environment = "tests" }
tests = { cmd = "ctest --test-dir build-$PIXI_ENVIRONMENT_NAME --output-on-failure --verbose", depends-on = ["build-tests"], default-environment = "tests" }
test-dynamic-alloc = { cmd = "cmake -B build-dynamic-alloc -G Ninja -DTINYOPT_BUILD_TESTS=ON -DTINYOPT_ENFORCE_NO_DYNAMIC_ALLOCATIONS=ON && cmake --build build-dynamic-alloc --target tinyopt_test_dynamic_alloc && ctest --test-dir build-dynamic-alloc --output-on-failure -R '^tinyopt_test_dynamic_alloc$'", default-environment = "tests" }
test-suitesparse = { cmd = "cmake -B build-test-suitesparse -G Ninja -DTINYOPT_BUILD_TESTS=ON -DTINYOPT_ENABLE_SUITESPARSE=ON && cmake --build build-test-suitesparse --target tinyopt_test_suitesparse && ctest --test-dir build-test-suitesparse --output-on-failure -R '^tinyopt_test_suitesparse$'", default-environment = "test-suitesparse" }

# Benchmarks
build-bench = { cmd = "cmake -B build-bench -G Ninja -DCMAKE_BUILD_TYPE=Release -DTINYOPT_BUILD_BENCHMARKS=ON -DTINYOPT_BUILD_CERES=ON && cmake --build build-bench --target tinyopt_bench_tinyopt", default-environment = "bench" }
bench = { cmd = "python benchmarks/scripts/benchmark.py --build-dir build-bench --only tinyopt", depends-on = ["build-bench"], default-environment = "bench" }
build-bench-all = { cmd = "cmake -B build-bench-all -G Ninja -DCMAKE_BUILD_TYPE=Release -DTINYOPT_BUILD_BENCHMARKS=ON -DTINYOPT_BUILD_CERES=ON -DTINYOPT_BUILD_G2O_BENCHMARKS=ON -DTINYOPT_BUILD_GTSAM_BENCHMARKS=ON && cmake --build build-bench-all --target tinyopt_bench_tinyopt tinyopt_bench_ceres tinyopt_bench_g2o tinyopt_bench_gtsam", default-environment = "bench-all" }
bench-all = { cmd = "python benchmarks/scripts/benchmark.py --build-dir build-bench-all --plot", depends-on = ["build-bench-all"], default-environment = "bench-all" }
bench-suitesparse = { cmd = "cmake -B build-bench-suitesparse -G Ninja -DCMAKE_BUILD_TYPE=Release -DTINYOPT_BUILD_BENCHMARKS=ON -DTINYOPT_ENABLE_SUITESPARSE=ON && cmake --build build-bench-suitesparse --target run_tinyopt_bench_suitesparse", default-environment = "bench-suitesparse" }

# Examples
build-examples = { cmd = "cmake -B build-examples -G Ninja -DTINYOPT_BUILD_TESTS=OFF -DTINYOPT_BUILD_EXAMPLES=ON -DTINYOPT_ENABLE_GRADIENT_DESCENT=ON -DTINYOPT_ENABLE_CONJUGATE_GRADIENT=ON -DTINYOPT_ENABLE_DOGLEG=ON -DTINYOPT_ENABLE_BFGS=ON -DTINYOPT_ENABLE_LBFGS=ON && cmake --build build-examples", default-environment = "tests" }
build-c-library = { cmd = "cmake -B build-c-library -G Ninja -DTINYOPT_BUILD_TESTS=ON -DTINYOPT_BUILD_EXAMPLES=OFF -DTINYOPT_BUILD_C_LIBRARY=ON && cmake --build build-c-library --target tinyopt_c", default-environment = "tests" }
test-c = { cmd = "cmake --build build-c-library --target tinyopt_c_tests && ctest --test-dir build-c-library --output-on-failure -R '^tinyopt_test_c_api($|_)'", depends-on = ["build-c-library"], default-environment = "tests" }

refactor-timings = { cmd = "python scripts/refactor_timings.py", default-environment = "docs" }
plot-refactor-timings = { cmd = "python scripts/plot_refactor_timings.py", default-environment = "docs" }

# Documentation
build-docs = { cmd = "cmake -B build-$PIXI_ENVIRONMENT_NAME -G Ninja -DTINYOPT_BUILD_DOCS=ON && cmake --build build-$PIXI_ENVIRONMENT_NAME --target docs", default-environment = "docs" }

# Packages & Installation
build-pkg = { cmd = "cmake -B build-$PIXI_ENVIRONMENT_NAME -G Ninja -DTINYOPT_BUILD_TESTS=OFF -DTINYOPT_BUILD_DOCS=ON -DTINYOPT_BUILD_PACKAGES=ON -DTINYOPT_BUILD_C_LIBRARY=ON && cmake --build build-$PIXI_ENVIRONMENT_NAME --target tinyopt_c && cmake --build build-$PIXI_ENVIRONMENT_NAME --target docs && cmake --build build-$PIXI_ENVIRONMENT_NAME --target deb --target src", default-environment = "docs" }
release = { cmd = "python scripts/release.py", default-environment = "release" }
install-local = { cmd = "cmake --install build-$PIXI_ENVIRONMENT_NAME --prefix /usr/local", depends-on = ["build"], default-environment = "default" }
pip-install = { cmd = "cmake -B build-pip -G Ninja -DTINYOPT_BUILD_TESTS=OFF -DTINYOPT_BUILD_PIP_PACKAGE=ON && cmake --build build-pip --target pip-install", default-environment = "pip" }

install-smoke-test = { cmd = "cmake -S . -B build-install -G Ninja -DTINYOPT_BUILD_TESTS=ON -DTINYOPT_BUILD_DOCS=ON -DTINYOPT_BUILD_INSTALL_TESTS=ON && cmake --build build-install --target docs && cmake --install build-install --prefix /tmp/tinyopt-install && test -f /tmp/tinyopt-install/share/doc/tinyopt/index.html && test -f /tmp/tinyopt-install/share/doc/tinyopt/guide/index.html && ctest --test-dir build-install --output-on-failure -R tinyopt_install_smoke_test", default-environment = "docs" }

# CI validation
ci-check = { cmd = "pixi run format-check && pixi run tests && pixi run build-docs", default-environment = "default" }

# Thrid parties builds
build-liepp = "cmake -B build -G Ninja -DTINYOPT_BUILD_LIEPLUSPLUS_TEST=ON && cmake --build build --target tinyopt_test_lie++"
