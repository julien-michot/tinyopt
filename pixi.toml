[workspace]
name = "tinyopt"
version = "0.1.0"
description = "A lightweight, header only optimization library"
authors = ["Julien Michot"]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-64"]

[dependencies]
eigen = ">=3.4.0"
cmake = ">=3.25"
ninja = ">=1.10"
compilers = ">=1.0"

# Features

[feature.docs.dependencies]
python = "3.12.*"
matplotlib = ">=3.8"
sphinx = "<8.0"
breathe = ">=4.35.0"
sphinx-rtd-theme = ">=1.0.0"
doxygen = ">=1.18.0"
myst-parser = ">=2.0.0"
catch2 = ">=3.0.1"

[feature.tests.dependencies]
catch2 = ">=3.0.1"

[feature.pip.dependencies]
python = ">=3.9"
pip = "*"

[feature.sophus.dependencies]
sophus = ">=22.10.2"

[feature.ceres.dependencies]
ceres-solver = ">=2.2.0"
openmp = "*"  # let's make sure openmp is on

[feature.benchmarks.dependencies]
catch2 = ">=3.0.1"
ceres-solver = ">=2.2.0"

[feature.fmt.dependencies]
fmt = ">=8.1.1"
clang-format = ">=18.0.0"
pre-commit = ">=3.7.0"

# --- Environments ---
# This tells Pixi which features to bundle together.
[environments]
default = ["tests"]
all = [ "sophus", "ceres"]
test = ["tests", "sophus"]
pip = ["pip"]
bench = ["benchmarks"]
test-ceres = ["tests", "sophus", "ceres"]
bench-ceres = ["benchmarks", "ceres"]
docs = ["docs"]
fmt =["fmt"]

[tasks]
# Cross-platform clean command targeting build-$PIXI_ENVIRONMENT_NAME
clean = { cmd = "rm -fr build-$PIXI_ENVIRONMENT_NAME" }
# Generic build
build = { cmd = "cmake -B build-$PIXI_ENVIRONMENT_NAME -G Ninja && cmake --build build-$PIXI_ENVIRONMENT_NAME", default-environment = "test" }

# Formatting
format = { cmd = "./scripts/format.sh", default-environment = "fmt" }
format-check = { cmd = "./scripts/format.sh --check", default-environment = "fmt" }

# Tests - Configures automatically on first run, incrementally builds subsequently
build-tests = { cmd = "cmake -B build-$PIXI_ENVIRONMENT_NAME -G Ninja -DTINYOPT_BUILD_TESTS=ON  && cmake --build build-$PIXI_ENVIRONMENT_NAME", default-environment = "test" }
tests = { cmd = "ctest --test-dir build-$PIXI_ENVIRONMENT_NAME --output-on-failure --verbose", depends-on = ["build-tests"], default-environment = "test" }
test-dynamic-alloc = { cmd = "cmake -B build-dynamic-alloc -G Ninja -DTINYOPT_BUILD_TESTS=ON -DTINYOPT_ENFORCE_NO_DYNAMIC_ALLOCATIONS=ON && cmake --build build-dynamic-alloc --target tinyopt_test_dynamic_alloc && ctest --test-dir build-dynamic-alloc --output-on-failure -R '^tinyopt_test_dynamic_alloc$'", default-environment = "test" }

# Benchmarks
build-bench = { cmd = "cmake -B build-$PIXI_ENVIRONMENT_NAME -G Ninja -DTINYOPT_BUILD_BENCHMARKS=ON && cmake --build build-$PIXI_ENVIRONMENT_NAME --target run_all_benchmarks", default-environment = "bench" }
bench = { cmd = "cmake --build build-$PIXI_ENVIRONMENT_NAME --target run_all_benchmarks", depends-on = ["build-bench"], default-environment = "bench" }
refactor-timings = { cmd = "python scripts/refactor_timings.py", default-environment = "docs" }
plot-refactor-timings = { cmd = "python scripts/plot_refactor_timings.py", default-environment = "docs" }

# Documentation
build-docs = { cmd = "cmake -B build-$PIXI_ENVIRONMENT_NAME -G Ninja -DTINYOPT_BUILD_DOCS=ON && cmake --build build-$PIXI_ENVIRONMENT_NAME --target docs", default-environment = "docs" }

# Packages & Installation
build-pkg = { cmd = "cmake -B build-$PIXI_ENVIRONMENT_NAME -G Ninja -DTINYOPT_BUILD_TESTS=OFF -DTINYOPT_BUILD_PACKAGES=ON && cmake --build build-$PIXI_ENVIRONMENT_NAME --target deb --target src", default-environment = "default" }
install-local = { cmd = "cmake --install build-$PIXI_ENVIRONMENT_NAME --prefix /usr/local", depends-on = ["build"], default-environment = "default" }
pip-install = { cmd = "cmake -B build-pip -G Ninja -DTINYOPT_BUILD_TESTS=OFF -DTINYOPT_BUILD_PIP_PACKAGE=ON && cmake --build build-pip --target pip-install", default-environment = "pip" }

install-smoke-test = { cmd = "cmake -S . -B build-install -G Ninja -DTINYOPT_BUILD_TESTS=OFF -DTINYOPT_BUILD_DOCS=OFF -DTINYOPT_BUILD_INSTALL_TESTS=ON && cmake --build build-install && cmake --install build-install --prefix /tmp/tinyopt-install && ctest --test-dir build-install --output-on-failure -R tinyopt_install_smoke_test", default-environment = "default" }

# CI validation
ci-check = { cmd = "pixi run format-check && pixi run tests && pixi run build-docs", default-environment = "default" }

# Thrid parties builds
build-liepp = "cmake -B build -G Ninja -DTINYOPT_BUILD_LIEPLUSPLUS_TEST=ON && cmake --build build --target tinyopt_test_lie++"
