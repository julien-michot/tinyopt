[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "tinyopt_build"
backend-path = ["bindings/python"]  # in-tree backend: setuptools plus the CMake build commands

[project]
name = "tinyopt"
version = "0.7.0"
description = "Tinyopt, a lightweight header-only optimization library"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
license = { text = "Apache-2.0" }
authors = [{ name = "Julien Michot" }]
keywords = ["optimization", "cpp", "header-only", "numerical", "scientific"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[tool.setuptools]
zip-safe = false
package-dir = { "" = "bindings/python" }
packages = ["tinyopt"]

[[tool.setuptools.ext-modules]]
name = "tinyopt._c_library"
sources = []

[tool.setuptools.cmdclass]
build_ext = "tinyopt_build.BuildCLibrary"
bdist_wheel = "tinyopt_build.PlatformWheel"

[tool.distutils.egg_info]
egg_base = "build/pip"
