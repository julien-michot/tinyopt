{% set version = "0.6.1" %}

package:
  name: tinyopt
  version: {{ version }}

source:
  url: https://github.com/julien-michot/tinyopt/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 4b005fe6333e5ba02e8f6335e52fa7a66397068a46a39d18bff4eb9b85d80913

build:
  number: 0
  noarch: generic
  script:
    - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PREFIX -DTINYOPT_BUILD_TESTS=OFF -DTINYOPT_BUILD_DOCS=ON -DTINYOPT_BUILD_PACKAGES=OFF -DTINYOPT_BUILD_PIP_PACKAGE=OFF
    - cmake --build build --target docs
    - cmake --build build
    - cmake --install build

requirements:
  build:
    - {{ compiler('cxx') }}
    - cmake >=3.25
    - ninja
    - python >=3.12
    - doxygen >=1.18
    - sphinx <8
    - breathe >=4.35
    - sphinx-rtd-theme >=1.0
    - myst-parser >=2.0
  host:
    - eigen >=3.4
  run:
    - eigen >=3.4

test:
  commands:
    - test -f $PREFIX/include/tinyopt/tinyopt.h
    - test -f $PREFIX/share/doc/tinyopt/3rdparty/ceres/LICENSE
    - test -f $PREFIX/share/doc/tinyopt/guide/index.html
    - test -f $PREFIX/lib/cmake/Tinyopt/TinyoptConfig.cmake

about:
  home: https://github.com/julien-michot/tinyopt
  license: Apache-2.0
  license_file: LICENSE
  summary: A lightweight, header-only C++20 optimization library
  description: |
    Tinyopt is a super fast header-only C++20 library for unconstrained optimization and nonlinear least squares.
  dev_url: https://github.com/julien-michot/tinyopt
