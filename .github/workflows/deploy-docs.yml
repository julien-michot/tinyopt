name: Deploy Documentation

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8.3

      - name: Install locked environments
        run: pixi install --frozen

      - name: Build Sphinx and Doxygen documentation
        run: pixi run build-docs

      - name: Build and test WebAssembly example
        run: pixi run test-wasm

      - name: Assemble Pages site
        run: |
          test -f build-docs/docs/index.html
          test -f build-docs/html/index.html
          test -f build-wasm/wasm-example/index.html
          test -f build-wasm/wasm-example/tinyopt.mjs
          test -f build-wasm/wasm-example/tinyopt.wasm
          mkdir -p site/wasm
          cp -a build-docs/docs/. site/
          cp -a build-docs/html site/doxygen
          cp -a build-wasm/wasm-example/. site/wasm/
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4