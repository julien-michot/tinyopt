name: Deploy Documentation

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve published release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.eventName === 'release'
              ? context.payload.release.tag_name
              : (await github.rest.repos.getLatestRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                })).data.tag_name;
            core.setOutput('tag', tag);

      - name: Check out latest release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: source-latest

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8.3

      - name: Install locked environments
        run: pixi install --frozen

      - name: Build Sphinx and Doxygen documentation
        run: pixi run build-docs

      - name: Build and test WebAssembly example
        run: pixi run test-wasm

      - name: Assemble development site
        run: |
          test -f build-docs/docs/index.html
          test -f build-docs/html/index.html
          test -f build-wasm/wasm-example/index.html
          test -f build-wasm/wasm-example/tinyopt.mjs
          test -f build-wasm/wasm-example/tinyopt.wasm
          mkdir -p site/dev/wasm
          mkdir -p site/dev/source/examples/c site/dev/source/examples/wasm
          cp -a build-docs/docs/. site/dev/
          cp -a build-docs/html site/dev/doxygen
          cp -a build-wasm/wasm-example/. site/dev/wasm/
          cp examples/c/*.c site/dev/source/examples/c/
          cp examples/wasm/optimizer.js site/dev/source/examples/wasm/

      - name: Install latest-release environment
        working-directory: source-latest
        run: pixi install --frozen

      - name: Build latest-release documentation and WASM example
        working-directory: source-latest
        run: pixi run build-docs && pixi run test-wasm

      - name: Assemble latest-release site
        run: |
          test -f source-latest/build-docs/docs/index.html
          test -f source-latest/build-docs/html/index.html
          test -f source-latest/build-wasm/wasm-example/index.html
          test -f source-latest/build-wasm/wasm-example/tinyopt.mjs
          test -f source-latest/build-wasm/wasm-example/tinyopt.wasm
          mkdir -p site/wasm site/source/examples/c site/source/examples/wasm
          cp -a source-latest/build-docs/docs/. site/
          cp -a source-latest/build-docs/html site/doxygen
          cp -a source-latest/build-wasm/wasm-example/. site/wasm/
          cp source-latest/examples/c/*.c site/source/examples/c/
          cp source-latest/examples/wasm/optimizer.js site/source/examples/wasm/
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4