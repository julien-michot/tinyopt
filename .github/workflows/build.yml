name: Tinyopt Build & Tests
run-name: Tinyopt Builds
on: [push]
jobs:
  windows-conda-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Conda (conda-forge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          channels: conda-forge
          channel-priority: strict
          activate-environment: test-env
          environment-file: '' # Add an env file if you have environment.yml

      - name: Install Build Dependencies via Conda
        shell: pwsh
        run: |
          conda install -y cmake ninja eigen catch2
          conda install -y sphinx breathe sphinx_rtd_theme
          conda install -c conda-forge myst-parser

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:CONDA_PREFIX" `
            -DTINYOPT_BUILD_TESTS=OFF `
            -DTINYOPT_BUILD_DOCS=ON `
            -DTINYOPT_BUILD_PACKAGES=OFF `
            -DTINYOPT_BUILD_PIP_PACKAGE=OFF

      - name: Build Tinyopt & Docs
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Run Tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release -V --output-on-failure

      - name: Install Tinyopt
        shell: pwsh
        run: |
          cmake --install build
